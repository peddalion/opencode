name: Portable Windows

on:
  push:
    branches:
      - dev
      - windows-portable
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Test core drive migration
        working-directory: packages/core
        run: bun test test/database-drive-migration.test.ts
      - name: Test desktop portable mode
        working-directory: packages/desktop
        run: bun test src/main/portable.test.ts electron-builder.config.test.ts
      - name: Typecheck core
        working-directory: packages/core
        run: bun typecheck
      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun typecheck
      - name: Prepare
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_CHANNEL: prod
      - name: Build
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod
      - name: Package portable zip
        working-directory: packages/desktop
        run: bun run package:win:portable
        env:
          OPENCODE_CHANNEL: prod
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-windows-x64-portable
          path: |
            packages/desktop/dist/*-portable.zip
            packages/desktop/dist/portable-build.json
      - name: Publish portable-latest release
        if: github.repository == 'peddalion/opencode' && github.ref_name == 'dev'
        shell: pwsh
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter '*-portable.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Portable zip not found' }
          gh release view portable-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create portable-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'OpenCode Portable Latest' --notes "Automated portable build from $env:GITHUB_SHA"
          } else {
            gh release edit portable-latest --repo $env:GITHUB_REPOSITORY --prerelease --title 'OpenCode Portable Latest' --notes "Automated portable build from $env:GITHUB_SHA"
          }
          gh release upload portable-latest $zip.FullName dist/portable-build.json --repo $env:GITHUB_REPOSITORY --clobber
