name: Sync upstream

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'peddalion/opencode'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Merge latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          release=$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name)
          git fetch upstream "refs/tags/$release:refs/tags/$release"
          if git merge-base --is-ancestor "$release" HEAD; then
            echo "Already contains $release"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$release"
          git push origin HEAD:dev
